# Watch/break cycle for mpv (mirrors LeechBlock "Incremental Timeboxing")
# 7 minutes of playback, then a 3 minute black-screen pause. After the break
# the video stays paused until you press SPACE.
watch_minutes=7
break_minutes=3

# If yes, time spent manually paused still counts toward the next break.
# If no, only actual playback time counts.
count_paused_time=yes

# Remember progress across episodes and mpv restarts. Closing mpv will NOT
# refill the watch budget or skip a break.
persist_state=yes

# Optional custom state file path. Empty means <config-dir>/timebox.state.
state_file=

enabled=yes
break_text=Break
