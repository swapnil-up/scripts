conky.config = {
    background = false,
    use_xft = true,
    font = 'JetBrainsMono Nerd Font:size=11',
    xftalpha = 0.9,
    update_interval = 1800,
    double_buffer = true,
    no_buffers = true,
    own_window = true,
    own_window_type = 'Conky',
    own_window_argb_visual = true,
    own_window_argb_value = 0,
    own_window_hints = 'undecorated,sticky,skip_taskbar,skip_pager,below',
    draw_shades = false,
    draw_outline = false,
    draw_borders = false,
    draw_blended = false,
    alignment = 'bottom_right',
    gap_x = 10,
    gap_y = 40,
    minimum_width = 320,
    minimum_height = 300,
    maximum_width = 320,
};

conky.text = [[
${color #B48EAD}${font JetBrainsMono Nerd Font:bold:size=13}XKCD${color}${font}
${image /tmp/conky_xkcd/comic_rgb.png -p 10,30 -s 300x212}${voffset 210}
${font JetBrainsMono Nerd Font:italic:size=10}${color #D8DEE9}${execpi 1800 cat /tmp/conky_xkcd/meta.txt 2>/dev/null | head -1}${font}${color}
${font JetBrainsMono Nerd Font:size=9}${color #4C566A}${execpi 1800 cat /tmp/conky_xkcd/meta.txt 2>/dev/null | tail -1}${font}${color}
]]
