conky.config = {
    background = false,
    use_xft = true,
    font = 'JetBrainsMono Nerd Font:size=11',
    xftalpha = 0.9,
    update_interval = 600,
    double_buffer = true,
    no_buffers = true,
    own_window = true,
    own_window_type = 'override',
    own_window_argb_visual = true,
    own_window_argb_value = 0,
    own_window_hints = 'undecorated,sticky,skip_taskbar,skip_pager,below',
    draw_shades = false,
    draw_outline = false,
    draw_borders = false,
    alignment = 'bottom_left',
    gap_x = 10,
    gap_y = 40,
    minimum_width = 200,
};

conky.text = [[
${color #EBCB8B}${font JetBrainsMono Nerd Font:bold:size=13}SUN${color}${font}
${execpi 600 ~/.config/conky/scripts/sunrise_sunset.sh | awk '
/rise/ { printf "↑ %s\n", $2 }
/set/  { printf "↓ %s\n", $2 }
/len/  { printf "☀ %s\n", $2 }
'}
]]
